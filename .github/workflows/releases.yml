name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  new-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Conventional Changelog Action
        id: changelog
        if: github.event_name == 'push'
        uses: TriPSs/conventional-changelog-action@v6.4.0
        with:
          github-token: ${{ secrets.github_token }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: steps.changelog.outputs.skipped == 'false'
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false

      # Only publish when the changelog step actually cut a new version. On a manual
      # workflow_dispatch that step is skipped, so `skipped` is empty and publishing
      # would retry a version npm already has.
      - name: Publish to npm
        if: steps.changelog.outputs.skipped == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
