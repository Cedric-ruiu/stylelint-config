version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # fix(deps) for runtime dependencies triggers a release; chore(deps-dev) does not.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      stylelint:
        patterns:
          - "stylelint*"
          - "postcss*"
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      gh-actions:
        patterns:
          - "*"
