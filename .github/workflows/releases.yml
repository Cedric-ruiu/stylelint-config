name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  new-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      # Runs the tests on the oldest supported runtime. The registry is deliberately
      # not configured here: publishing needs a newer Node than .nvmrc pins, and
      # setup-node is run again further down for that.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Conventional Changelog Action
        id: changelog
        if: github.event_name == 'push'
        uses: TriPSs/conventional-changelog-action@v6.4.0
        with:
          github-token: ${{ secrets.github_token }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: steps.changelog.outputs.skipped == 'false'
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14. .nvmrc pins the
      # oldest runtime this package supports (22.12), which ships npm 10.9, so the
      # publish runs on Node 24 instead. Nothing calls yarn after this point, so the
      # .npmrc that registry-url writes is never parsed by yarn.
      - name: Setup Node.js for publishing
        if: steps.changelog.outputs.skipped == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Turns an npm that is too old into a readable failure here, rather than a
      # confusing authentication error at publish time.
      - name: Verify npm supports trusted publishing
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          required=11.5.1
          current=$(npm --version)
          echo "npm $current (trusted publishing requires >= $required)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $current is below the $required required for trusted publishing"
            exit 1
          fi

      # Authenticated by OIDC through the trusted publisher configured on npmjs.com
      # for this repository and workflow file — no stored token, and provenance is
      # generated automatically.
      #
      # Only publishes when the changelog step actually cut a new version. On a manual
      # workflow_dispatch that step is skipped, so `skipped` is empty and publishing
      # would retry a version npm already has.
      - name: Publish to npm
        if: steps.changelog.outputs.skipped == 'false'
        run: npm publish --access public
