name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor of each supported line, from stylelint 18:
        # ^22.22.2 || ^24.15.0 || >=26
        node-version: ["22.22.2", "24.15.0", 26]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # The runner's global Yarn 1 defers to the release committed in
      # .yarn/releases (yarnPath), so no Corepack is needed.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint fixtures and formatting
        run: yarn lint
